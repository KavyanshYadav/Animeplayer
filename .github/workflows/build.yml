name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/**'
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up the Android SDK
        # The third version of the action installed the package `tools` by default. That
        # package no longer exists in the repository of Google, so the installation
        # failed with "Package 'tools' is not available" and the job died before the
        # build even started. The fourth version asks for the platform tools only.
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;37.0.0'

      - name: Build the phone application
        run: ./gradlew :samples:android:assembleDebug

      - name: Build the television application
        run: ./gradlew :samples:android-tv:assembleDebug

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: animeplayer-apks
          path: |
            samples/android/build/outputs/apk/debug/*.apk
            samples/android-tv/build/outputs/apk/debug/*.apk
          retention-days: 7
